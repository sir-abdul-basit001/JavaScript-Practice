<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QR Generator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <section>
      <header>
        <div class="heading">
          <h1>Generate QR Code</h1>
          <br />
        </div>
      </header>
      <main>
        <div class="input">
          <span id="input-text">
            <input type="text " placeholder="Type your text or URL" />
          </span>

          <div class="box">
            <span> Select Size: </span>

            <select name="" id="size">
              <option value="">100x100</option>
            </select>
          </div>
        </div>
        <div class="btns btn">
          <button id="last-btn">Generate</button>
          <button id="last-btn">Download</button>
        </div>
      </main>

      <footer>footer</footer>
    </section>
  </body>
</html>
